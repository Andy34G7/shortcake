[project]
name = "shortcake"
version = "0.1.0"
description = "Ultra-small performant hybrid Mamba-Transformer model for code"

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.15.0",
    "datasets>=2.16.0",
    "transformers>=4.36.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "accelerate>=0.25.0",
    "matplotlib>=3.7.0",
    "pytest>=7.4.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

